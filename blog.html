<script src="assets/js/main.js"></script>
<script>
  (function () {
    const list = document.getElementById("all-posts");
    const filter = document.getElementById("filter");
    loadPosts().then((posts) => {
      const tags = ["All", ...new Set(posts.map((p) => p.tag || "Note"))];
      let active = "All";
      function draw() {
        renderPostList(list, active === "All" ? posts : posts.filter((p) => (p.tag || "Note") === active));
        filter.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tag === active)));
      }
      filter.innerHTML = tags.map((t) => `<button type="button" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join("");
      filter.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        active = b.dataset.tag;
        draw();
      });
      draw();
    }).catch(() => { list.innerHTML = '<li class="post-empty">Posts could not be loaded.</li>'; });
  })();
</script>
